name: Orderx
description: "Orderx Sales Order Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.4

  # State management
  provider: ^6.1.1

  # Utilities
  intl: ^0.19.0
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^10.1.4
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  crypto: ^3.0.3
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2

  # Charts
  syncfusion_flutter_charts: ^27.1.48

  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  mobile_scanner: ^3.5.5
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.0

  # Location Tracking
  google_maps_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  battery_plus: ^7.0.0
  geocoding: ^2.1.0
  http: ^1.1.0
  flutter_foreground_task: ^8.11.0
  connectivity_plus: ^6.0.3

  # App icon generator
  flutter_launcher_icons: ^0.14.4
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0   

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
 
  # Register your asset folders (optional, but good practice)   
  assets:
    - assets/icon/
    - assets/images/

